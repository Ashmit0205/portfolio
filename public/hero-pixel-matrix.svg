<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- CRT Phosphor Outer Glow -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Laptop Screen Glow -->
    <filter id="screenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanline Overlay -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="600" y2="0" stroke="rgba(0, 20, 0, 0.4)" stroke-width="1.5" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 12px rgba(57, 255, 20, 0.6)); }
        50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(57, 255, 20, 0.95)); }
      }
      @keyframes crtFlicker {
        0% { opacity: 0.97; }
        50% { opacity: 1; }
        52% { opacity: 0.93; }
        54% { opacity: 1; }
        80% { opacity: 0.98; }
        90% { opacity: 0.95; }
        100% { opacity: 1; }
      }
      @keyframes matrixGlitch {
        0%, 100% { transform: translateY(0); }
        30% { transform: translateY(-1px); }
        70% { transform: translateY(1px); }
      }
      .pixel-body {
        animation: pulseGlow 4s ease-in-out infinite, crtFlicker 0.15s infinite;
      }
      .screen-code {
        animation: matrixGlitch 2s steps(2) infinite;
      }
      .cursor-blink {
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <g class="pixel-body" filter="url(#greenGlow)">
    <!-- Base Pixel Blocks for Hooded Figure Silhouette & Halftone Grid -->
    
    <!-- HOOD & HEAD PIXEL BLOCKS -->
    <!-- Top Hood Curve -->
    <rect x="270" y="55" width="60" height="12" fill="#39FF14" />
    <rect x="246" y="67" width="108" height="12" fill="#39FF14" />
    <rect x="234" y="79" width="132" height="12" fill="#39FF14" />
    <rect x="222" y="91" width="156" height="12" fill="#39FF14" />
    <rect x="216" y="103" width="168" height="12" fill="#39FF14" />
    <rect x="210" y="115" width="180" height="12" fill="#39FF14" />
    <rect x="204" y="127" width="192" height="12" fill="#39FF14" />
    
    <!-- Hood Outline & Outer Dithered Texture -->
    <rect x="198" y="139" width="204" height="24" fill="#39FF14" />
    <rect x="192" y="163" width="216" height="36" fill="#39FF14" />
    <rect x="186" y="199" width="228" height="36" fill="#39FF14" />

    <!-- Hood Face Cavity / Deep Shadow (Negative Space) -->
    <path d="M 240 120 Q 300 100 360 120 Q 380 180 345 225 Q 300 245 255 225 Q 220 180 240 120 Z" fill="#05070b" />
    <!-- Inner Hood Rim Pixel Edge -->
    <path d="M 238 122 Q 298 102 358 122 Q 378 180 344 223 Q 300 243 256 223 Z" stroke="#39FF14" stroke-width="4" fill="none" stroke-dasharray="6,3" />

    <!-- SHOULDERS & TORSO (Pixel Steps) -->
    <!-- Neck / Upper Chest -->
    <rect x="240" y="235" width="120" height="24" fill="#39FF14" />
    <!-- Hoodie Strings / Zipper Accent -->
    <rect x="296" y="235" width="8" height="48" fill="#a3ff85" />
    
    <!-- Left Shoulder & Arm -->
    <rect x="156" y="235" width="84" height="24" fill="#39FF14" />
    <rect x="138" y="259" width="90" height="36" fill="#39FF14" />
    <rect x="120" y="295" width="96" height="48" fill="#39FF14" />
    <rect x="114" y="343" width="90" height="60" fill="#39FF14" />

    <!-- Right Shoulder & Arm -->
    <rect x="360" y="235" width="84" height="24" fill="#39FF14" />
    <rect x="372" y="259" width="90" height="36" fill="#39FF14" />
    <rect x="384" y="295" width="96" height="48" fill="#39FF14" />
    <rect x="396" y="343" width="90" height="60" fill="#39FF14" />

    <!-- Torso Core & Creases -->
    <rect x="228" y="259" width="144" height="96" fill="#39FF14" />
    <rect x="216" y="355" width="168" height="48" fill="#39FF14" />

    <!-- Torso Creases / Dither details (dark slits) -->
    <rect x="234" y="280" width="30" height="6" fill="#05070b" />
    <rect x="336" y="280" width="30" height="6" fill="#05070b" />
    <rect x="246" y="310" width="48" height="6" fill="#05070b" />
    <rect x="306" y="310" width="48" height="6" fill="#05070b" />
    <rect x="228" y="340" width="144" height="8" fill="#05070b" />

    <!-- HANDS ON KEYBOARD (Pixelated Fingers) -->
    <rect x="210" y="380" width="42" height="24" fill="#66ff47" />
    <rect x="204" y="392" width="12" height="18" fill="#39FF14" />
    <rect x="222" y="395" width="12" height="18" fill="#39FF14" />
    <rect x="240" y="392" width="12" height="18" fill="#39FF14" />

    <rect x="348" y="380" width="42" height="24" fill="#66ff47" />
    <rect x="348" y="392" width="12" height="18" fill="#39FF14" />
    <rect x="366" y="395" width="12" height="18" fill="#39FF14" />
    <rect x="384" y="392" width="12" height="18" fill="#39FF14" />

    <!-- CROSS-LEGGED LEGS & SITTING BASE -->
    <!-- Left Knee & Thigh -->
    <rect x="84" y="403" width="144" height="48" fill="#39FF14" />
    <rect x="72" y="427" width="132" height="48" fill="#39FF14" />
    <rect x="96" y="475" width="144" height="36" fill="#39FF14" />

    <!-- Right Knee & Thigh -->
    <rect x="372" y="403" width="144" height="48" fill="#39FF14" />
    <rect x="396" y="427" width="132" height="48" fill="#39FF14" />
    <rect x="360" y="475" width="144" height="36" fill="#39FF14" />

    <!-- Cross-Legged Fold & Sneakers / Feet -->
    <rect x="180" y="487" width="240" height="36" fill="#39FF14" />
    <!-- Left Shoe -->
    <rect x="120" y="500" width="72" height="24" fill="#66ff47" />
    <rect x="110" y="512" width="48" height="18" fill="#39FF14" />
    <!-- Right Shoe -->
    <rect x="408" y="500" width="72" height="24" fill="#66ff47" />
    <rect x="442" y="512" width="48" height="18" fill="#39FF14" />

    <!-- Floor Shadow / Contact Pixels -->
    <rect x="96" y="530" width="408" height="10" fill="rgba(57, 255, 20, 0.3)" />
    <rect x="144" y="540" width="312" height="6" fill="rgba(57, 255, 20, 0.15)" />

    <!-- LAPTOP (OPEN & GLOWING SCREEN) -->
    <!-- Laptop Base / Keyboard Deck -->
    <polygon points="195,415 405,415 435,435 165,435" fill="#152b18" stroke="#39FF14" stroke-width="4" stroke-linejoin="round" />
    <!-- Keyboard Key Grid Rows -->
    <line x1="205" y1="422" x2="395" y2="422" stroke="#39FF14" stroke-width="2" stroke-dasharray="4,3" />
    <line x1="190" y1="428" x2="410" y2="428" stroke="#39FF14" stroke-width="2" stroke-dasharray="4,3" />
    <!-- Trackpad -->
    <rect x="280" y="425" width="40" height="8" fill="#0a1a0c" stroke="#39FF14" stroke-width="1.5" />

    <!-- Laptop Display Screen (Tilted Up towards user) -->
    <g filter="url(#screenGlow)">
      <!-- Outer Display Bezel -->
      <polygon points="210,275 390,275 405,415 195,415" fill="#040905" stroke="#39FF14" stroke-width="5" stroke-linejoin="round" />
      <!-- Inner Glowing Matrix Screen -->
      <polygon points="218,283 382,283 396,408 204,408" fill="#061f0a" stroke="#39FF14" stroke-width="1.5" />

      <!-- Glowing Matrix Code Lines on Screen -->
      <g class="screen-code" fill="#39FF14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">
        <text x="226" y="302">&gt; SYS_INIT: OK</text>
        <text x="226" y="318">01011001 01101</text>
        <text x="226" y="334">KERNEL::ROOT#</text>
        <text x="226" y="350">CONNECT_NODE_0</text>
        <text x="226" y="366">EXEC_PIPELINE</text>
        <text x="226" y="382">STATUS: RUNNING</text>
        <text x="226" y="398">&gt; <tspan class="cursor-blink">_</tspan></text>

        <!-- Right Side Binary Matrix Rain Column -->
        <text x="345" y="302" opacity="0.8">101</text>
        <text x="345" y="318" opacity="0.9">010</text>
        <text x="345" y="334" opacity="0.6">110</text>
        <text x="345" y="350" opacity="0.9">001</text>
        <text x="345" y="366" opacity="0.7">101</text>
        <text x="345" y="382" opacity="0.95">111</text>
      </g>
    </g>

    <!-- Halftone CRT Scanline Overlay across graphic -->
    <rect x="60" y="40" width="480" height="510" fill="url(#scanlines)" pointer-events="none" />
  </g>
</svg>
